[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strategylab"
version = "0.1.0"
description = "Среда для тестирования торговых стратегий"
requires-python = ">=3.12"
dependencies = ["httpx"]

[dependency-groups]
dev = ["pytest", "ruff", "mypy"]

[tool.setuptools]
packages = [
    "strategylab",
    "strategylab.core",
    "strategylab.data",
    "strategylab.spec",
    "strategylab.broker",
    "strategylab.strategy",
    "strategylab.drivers",
    "strategylab.report",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "network: требует доступа к api.bybit.com",
]

[tool.ruff]
line-length = 100
extend-exclude = ["strategydocs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
# scripts/{carry,deviation}/grid.py одноименны — mypy обязан маппить файлы
# через базу пакетов (cwd), а не по basename.
explicit_package_bases = true
namespace_packages = true
mypy_path = "."
